<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10091e">
<title>NEXBOTS</title>
<style>
:root{color-scheme:dark;--bg:#0b0715;--panel:#1c1428;--line:#51356a;--text:#f6f0ff;--muted:#c1b2d1;--purple:#ae64ef}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,'Noto Sans Arabic',sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#492169 0%,transparent 55%),var(--bg);display:flex;flex-direction:column}
header{height:74px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #3d2953;background:#0e0a1bcf}
header strong{font-size:24px;font-weight:900;letter-spacing:2px}header small{display:block;text-align:center;font-size:9px;letter-spacing:2px;color:#c2b2d8}
main{width:min(92%,520px);margin:auto;display:grid;place-items:center;padding-bottom:95px}
.panel{width:100%;padding:40px 25px;background:linear-gradient(155deg,#291638,#14101f);border:1px solid var(--line);border-radius:24px;text-align:center;box-shadow:0 12px 48px #0006}
.logo{display:grid;place-items:center;margin:0 auto 23px;width:70px;height:70px;border-radius:21px;background:#4c2771;color:#fff;border:1px solid #c68dff;font-size:30px;font-weight:900}
h1{font-size:23px;margin:0 0 12px;line-height:1.6}p{font-size:13px;color:var(--muted);line-height:2;margin:0 auto 25px;max-width:340px}
button{font:inherit;color:#fff;font-size:14px;font-weight:800;width:100%;padding:15px 10px;border:0;border-radius:13px;background:linear-gradient(110deg,#b971ec,#742bea);cursor:pointer}
small.note{font-size:11px;color:#9f91b1;display:block;line-height:1.8;margin-top:14px}
</style>
</head>
<body>
<header><div><strong>NEXBOTS</strong><small>THE NEXT GENERATION</small></div></header>
<main><section class="panel" aria-label="NEXBOTS"><div class="logo">N</div><h1>NEXBOTS</h1><p>تستطيع متابعة المنصة عند توفر الاتصال. سنفتح آخر قسم كنت تتصفحه تلقائيًا عندما تتصل بالشبكة.</p><button id="open" type="button">فتح NEXBOTS</button><small class="note">يظهر هذا العرض فقط عندما لا تتوفر نسخة محفوظة من المنصة.</small></section></main>
<script>
const path=new URLSearchParams(location.search).get('path')||'/';
const target=/^\/(?:|explore|plans|support|verification|account|chat|private|upload|admin|u\/[A-Za-z0-9_-]{1,128}|project\/[A-Za-z0-9_-]{1,128}|private\/t\/[A-Za-z0-9_-]{1,80})$/.test(path)?path:'/';
document.getElementById('open').addEventListener('click',()=>location.replace('https://nexbots.pages.dev'+target));
</script>
</body>
</html>
