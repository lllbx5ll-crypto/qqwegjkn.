
name: NEXBOTS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test website source
        working-directory: site
        run: npm test

      - name: Build website
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build

  android-apk:
    needs: check-website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Firebase and signing
        shell: bash
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.FIREBASE_ANDROID_JSON_B64 }}
          NEXBOTS_TEST_KEYSTORE_B64: ${{ secrets.NEXBOTS_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [[ -n "$FIREBASE_ANDROID_JSON_B64" ]]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_B64" \
              | base64 --decode > app/google-services.json
          else
            cp firebase-client-config.json app/google-services.json
          fi

          python3 - <<'PYVALIDATE'
          import json

          with open('app/google-services.json', encoding='utf-8') as f:
              conf = json.load(f)

          packages = [
              c.get('client_info', {})
               .get('android_client_info', {})
               .get('package_name')
              for c in conf.get('client', [])
          ]

          assert 'dev.nexbots.android' in packages, \
              'Firebase package name mismatch'

          assert conf.get('project_info', {}).get('project_id') == 'exbots', \
              'Firebase project mismatch'

          print('Firebase configuration validated')
          PYVALIDATE

          if [[ -n "$NEXBOTS_TEST_KEYSTORE_B64" ]]; then
            printf '%s' "$NEXBOTS_TEST_KEYSTORE_B64" \
              | base64 --decode > app/debug.keystore
            chmod 600 app/debug.keystore
            echo 'Stable test signing configured'
          else
            echo "::warning title=Google Sign-In and signing::NEXBOTS_TEST_KEYSTORE_B64 is missing. This runner generates a fresh debug certificate, so each new APK has a different SHA-1 and cannot update an APK signed with another certificate. Register the actual SHA-1/SHA-256 shown in this workflow in Firebase and configure a stable signing secret before distributing future builds."
            echo 'Using temporary debug signing - fingerprint changes between runners'
          fi

      - name: Build Android APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXBOTS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show signing fingerprints
        continue-on-error: true
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "APK not found"
            exit 0
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner \
            | sort -V | tail -n 1)"

          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --print-certs "$APK" \
              | grep -Ei 'SHA-1|SHA-256|SHA1|SHA256' || true
          else
            echo "Fingerprint tool not found"
          fi
